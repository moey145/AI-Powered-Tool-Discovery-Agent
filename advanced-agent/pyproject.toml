[project]
name = "tool-discovery-agent"
version = "2.0.0"
description = "AI research agent that finds and compares developer tools"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13",
    "fastapi>=0.116",
    "httpx[brotli]>=0.28",
    "langchain-core>=0.3.72",
    "langchain-openai>=0.3.27",
    "langgraph>=0.6",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "redis>=6.0",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "fakeredis>=2.30",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = [
    "B008", # FastAPI's Depends() in argument defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"evals/*" = ["S101"]
"api.py" = ["S104"] # binding 0.0.0.0 is correct inside a container
